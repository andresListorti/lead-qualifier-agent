[project]
name = "lead-qualifier-agent"
version = "0.1.0"
description = "Portfolio lead qualification API using DEMO DATA"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2", "pymysql>=1.1,<2", "cryptography>=44", "pyjwt[crypto]>=2.9,<3",
  "uvicorn>=0.34,<1", "httpx>=0.28,<1", "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
