services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: leads
      MYSQL_USER: lead_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u lead_app -D leads -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
